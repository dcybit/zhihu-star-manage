<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #1a1a1a;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo img { width: 24px; height: 24px; }
    .logo h1 { font-size: 15px; font-weight: 600; }
    .desc {
      font-size: 12px;
      color: #8590a6;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #openBtn {
      background: #056de8;
      color: #fff;
      font-weight: 600;
    }
    #openBtn:hover { background: #0461cf; }
    #loginBtn {
      display: none;
      margin-top: 8px;
      background: #f6f6f6;
      color: #056de8;
      border: 1px solid #056de8;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #8590a6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="icons/icon48.png" alt="">
    <h1>知乎收藏夹批量管理</h1>
  </div>
  <p class="desc">批量浏览、筛选、取消收藏，并将收藏内容导出为 JSON / Markdown / CSV。</p>
  <button id="openBtn">打开收藏管理器</button>
  <button id="loginBtn">先登录知乎</button>
  <p id="status">检测登录状态中…</p>
  <script src="popup.js"></script>
</body>
</html>
